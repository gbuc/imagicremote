<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>iMagicRemote</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <video id="hdmi" autoplay muted playsinline></video>
    <div id="overlay"></div>
    <input id="kb-input" type="text" autocomplete="off" autocorrect="off" spellcheck="false" aria-hidden="true" />
    <div id="mac-status" hidden></div>
    <div id="banner" hidden></div>
    <div id="settings" hidden>
      <div id="settings-card">
        <h1>iMagicRemote</h1>
        <p>HDMI</p>
        <div id="hdmi-picks"></div>
        <p>Mac IPv4</p>
        <div id="octets">
          <input data-oct="0" maxlength="3" inputmode="numeric" />
          <span>.</span>
          <input data-oct="1" maxlength="3" inputmode="numeric" />
          <span>.</span>
          <input data-oct="2" maxlength="3" inputmode="numeric" />
          <span>.</span>
          <input data-oct="3" maxlength="3" inputmode="numeric" />
        </div>
        <button id="save">Save</button>
        <p class="hint">Red toggles this panel. Back closes it. Yellow opens the keyboard. Green or long-press: right click. Wheel: scroll.</p>
      </div>
    </div>
    <script src="js/normalize.js"></script>
    <script src="js/config.js"></script>
    <script src="js/hdmi.js"></script>
    <script src="js/bridge.js"></script>
    <script src="js/pointer.js"></script>
    <script src="js/keyboard.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/keys.js"></script>
    <script src="js/eim.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
